# Publishes the site to Firebase Hosting on every push to main.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # The TMDB key is baked in at build time. Refuse to deploy without it
      # rather than publish a site where every TMDB call fails.
      - name: Check TMDB key secret
        run: test -n "$VITE_TMDB_API_KEY" || (echo "::error::Add the VITE_TMDB_API_KEY repository secret" && exit 1)
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
      - run: npm test
      - run: npm run build
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WACHTLIST_MAKER }}
          channelId: live
          projectId: wachtlist-maker
